<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="放置江湖 玩家查询：输入游戏内 UID，实时拉取该角色的等级、门派、武学、准备位与装备。" />
<meta name="theme-color" content="#8c2f28" />
<meta name="robots" content="noindex, nofollow" />
<meta property="og:type" content="website" />
<meta property="og:title" content="玩家查询 · 放置江湖高手榜" />
<meta property="og:description" content="输入 UID 实时查询角色档案，不用装客户端。" />
<meta property="og:url" content="https://fzpaihang.github.io/lanlandeku/lookup.html" />
<meta name="twitter:card" content="summary" />
<link rel="canonical" href="https://fzpaihang.github.io/lanlandeku/lookup.html" />
<title>玩家查询 · 放置江湖高手榜</title>
<link rel="stylesheet" href="./assets/style.css?v=7d5bb0ae" />
</head>
<body>

<a class="skip" href="#main">跳到查询表单</a>

<header class="hero">
  <div class="wrap">
    <div class="brand">
      <span class="seal">查<br>询</span>
      <div class="brand-txt">
        <h1>玩家查询</h1>
        <p class="sub">放置江湖 · 输入 UID 查实时档案</p>
      </div>
    </div>
    <div id="server-switch" class="srv-switch" hidden></div>
    <div class="meta">
      <span id="state" class="pill ghost">已暂停</span>
      <a class="navbtn" href="./index.html">高手榜 ›</a>
    </div>
  </div>
</header>

<main class="wrap" id="main">

  <p id="notice" class="banner" role="status" hidden></p>

  <p class="banner" role="status">
    实时查询服务已暂停：按 UID 实时拉取档案需要常驻后端，目前先关闭。排行榜与玩家档案仍可正常浏览。
  </p>

  <section class="lk" aria-label="按 UID 或昵称查询">
    <div class="lk-row">
      <div class="lk-field">
        <input id="uid" class="lk-input" type="text" maxlength="20"
               placeholder="实时查询已暂停" aria-label="游戏内昵称或 UID"
               autocomplete="off" enterkeyhint="search" disabled
               role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" />
        <div id="suggest" class="lk-suggest" role="listbox" aria-label="昵称候选" hidden></div>
      </div>
      <button id="go" class="lk-btn" type="button" disabled>已暂停</button>
    </div>
    <p class="lk-hint" id="mode">服务恢复后支持两种输入：<b>UID</b>（5–12 位纯数字），或<b>昵称</b>（从五区排行榜匹配，重名会列出候选）。</p>
  </section>

  <section id="result" class="lk-result" aria-live="polite" hidden></section>

  <div id="tips" class="lk-empty" hidden>
    <p>查过的角色</p>
    <div id="recent" class="lk-recent"></div>
  </div>

  <p class="foot">
    查询功能已关闭，本页仅作说明保留；排行榜与玩家档案在高手榜里可正常浏览。<br />
    档案是<b>实时</b>数据，和排行榜的快照可能有出入（排行榜只在玩家活跃时刷新）。
  </p>
</main>

</body>
</html>
