name: 构建 APK

# 手机端「玩家查询」工具：buildozer 打包成 debug APK，产物在 Actions 页面下载。
# 首次构建需下载 Android SDK/NDK（约 2–3 GB），约 40–60 分钟；命中缓存后约 15–20 分钟。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    # 不用 ubuntu-latest：新镜像（ubuntu26）上 buildozer 的 ant 工具链常出问题
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # 必须用 3.10：p4a 把 pyjnius 锁在 1.7.0，而它没有 cp311 的 wheel，
          # 用 3.11 会报「Could not find a version that satisfies pyjnius==1.7.0」
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3"

      - name: 缓存 Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            apk/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('apk/buildozer.spec', 'apk/main.py') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 注入分区凭据
        working-directory: apk
        env:
          SERVERS_JSON: ${{ secrets.FZJH_SERVERS }}
        run: |
          if [ -z "$SERVERS_JSON" ]; then
            echo "缺少 Secret FZJH_SERVERS，无法打包" >&2
            exit 1
          fi
          printf '%s' "$SERVERS_JSON" > config.json
          python - <<'PY'
          import json, io
          d = json.load(io.open('config.json', encoding='utf-8'))
          keys = [s['key'] for s in d.get('servers', [])]
          print('已注入 %d 个分区: %s' % (len(keys), ', '.join(keys)))
          PY

      - name: 打包 APK
        working-directory: apk
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          set -o pipefail
          # 不用 | tail（会把 buildozer 的退出码吃掉），改成 tee 后单独截取
          buildozer -v android debug 2>&1 | tee build.log
          echo "=== 最后 80 行 ==="
          tail -80 build.log

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: apk/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 列出产物
        if: always()
        run: |
          echo "### APK 产物" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "apk/bin/*.apk" > /dev/null; then
            ls -lh apk/bin/*.apk
            for f in apk/bin/*.apk; do
              echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "**没有生成 APK**，请查看 build-log artifact" >> "$GITHUB_STEP_SUMMARY"
            ls -lh apk/bin/ 2>/dev/null || echo "bin 目录不存在"
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: fzjh-lookup-apk
          path: apk/bin/*.apk
          if-no-files-found: error
          retention-days: 30
