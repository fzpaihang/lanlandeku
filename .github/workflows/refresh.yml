name: 刷新高手榜

# 北京时间 = UTC+8，每个分区一天只跑一次全量，时间错开
#   0 22 * * *  → 次日 06:00  苍松迎客（taptap）
#   55 15 * * *  → 当日 23:55  白鹤亮翅 + 丹凤朝阳（taptap_2,taptap_3）
#   0 4 * * *  → 当日 12:00  墨羽惊鸿（taptap_4）
#   0 10 * * *  → 当日 18:00  4399
# 单区全量约 5–8 分钟，四条任务互不重叠，也避免连续请求触发限流。
on:
  schedule:
    - cron: '0 22 * * *'   # 06:00 苍松迎客
    - cron: '55 15 * * *'  # 23:55 白鹤亮翅 + 丹凤朝阳
    - cron: '0 4 * * *'    # 12:00 墨羽惊鸿
    - cron: '0 10 * * *'   # 18:00 4399
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'probe'
        type: choice
        options:
          - probe        # 只验证能不能连上游戏服，不写文件
          - full         # 榜单 + 档案
          - board        # 只抓榜单
      server:
        description: '目标分区（手动触发时生效，定时任务由 cron 决定）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - taptap
          - taptap_2
          - taptap_3
          - taptap_4
          - 4399

permissions:
  contents: write

concurrency:
  group: refresh-fzjh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 单区全量实测 7–8 分钟；五区一次跑（server=all）实测 29 分钟，
    # 因此放宽到 45 分钟，避免「手动全量」卡在 30 分钟上限被中断导致数据不提交。
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 定时任务没有输入参数，靠 github.event.schedule 反查本次该抓哪个区
      - name: 解析本次目标分区
        id: t
        env:
          SCHED: ${{ github.event.schedule }}
          PICK: ${{ inputs.server }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -n "$MODE" ]; then
            t="$PICK"
          else
            # github.event.schedule 原样返回 cron 字符串；历史上出现过双空格，
            # 先压缩多余空格再匹配，避免落到 *) 误跑五区全量。
            SCHED_N=$(printf '%s' "$SCHED" | tr -s ' ' | sed 's/^ *//;s/ *$//')
            case "$SCHED_N" in
              '0 22 * * *')  t='taptap' ;;
              '55 15 * * *') t='taptap_2,taptap_3' ;;
              '0 4 * * *')   t='taptap_4' ;;
              '0 10 * * *')  t='4399' ;;
              *)             t='all' ;;
            esac
          fi

          case "$t" in
            taptap)            n='苍松迎客' ;;
            taptap_2,taptap_3) n='白鹤+丹凤' ;;
            taptap_2)          n='白鹤亮翅' ;;
            taptap_3)          n='丹凤朝阳' ;;
            taptap_4)          n='墨羽惊鸿' ;;
            4399)              n='4399' ;;
            *)                 n='全部' ;;
          esac

          echo "target=$t" >> "$GITHUB_OUTPUT"
          echo "label=$n"  >> "$GITHUB_OUTPUT"
          {
            echo "### 本次刷新：$n（$t）"
            echo ""
            echo "- 触发方式：${MODE:-schedule}"
            echo "- UTC 时间：$(date -u '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"

      # 凭据全部走 Secrets，绝不写进仓库
      - name: 连通性探测
        env:
          FZJH_SERVERS: ${{ secrets.FZJH_SERVERS }}
          FZJH_HOTVER: ${{ secrets.FZJH_HOTVER }}
          T: ${{ steps.t.outputs.target }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/fetch.py --probe
          else python scripts/fetch.py --probe --server "$T"; fi

      - name: 抓榜单
        if: github.event_name == 'schedule' || inputs.mode != 'probe'
        env:
          FZJH_SERVERS: ${{ secrets.FZJH_SERVERS }}
          FZJH_HOTVER: ${{ secrets.FZJH_HOTVER }}
          T: ${{ steps.t.outputs.target }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/fetch.py
          else python scripts/fetch.py --server "$T"; fi

      - name: 抓玩家档案
        # 每个区的定时任务都是一次全量，所以只要不是 probe/board 就抓档案
        if: (github.event_name == 'schedule') || (inputs.mode == 'full')
        env:
          FZJH_SERVERS: ${{ secrets.FZJH_SERVERS }}
          FZJH_HOTVER: ${{ secrets.FZJH_HOTVER }}
          T: ${{ steps.t.outputs.target }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/fetch_profiles.py
          else python scripts/fetch_profiles.py --server "$T"; fi

      - name: 合并档案经验
        # 档案抓完再合并：get_board 对不活跃玩家会返回旧经验，用 get_user_info 的值覆盖，
        # 让表格、详情、增长曲线统一口径。名次仍是游戏原始名次，不重排。
        if: (github.event_name == 'schedule') || (inputs.mode == 'full')
        env:
          T: ${{ steps.t.outputs.target }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/merge_exp.py
          else python scripts/merge_exp.py --server "$T"; fi

      - name: 提交数据
        env:
          LABEL: ${{ steps.t.outputs.label }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "数据刷新 $LABEL $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          # 抓取期间远端可能已被其它提交推进（例如热更包通过 API 提交），
          # 先 rebase 到最新 main 再推，避免 non-fast-forward 导致整批数据丢失。
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort 2>/dev/null || true
              echo "rebase 冲突，放弃本次提交（data/ 已由 artifact 保留）"
              exit 1
            fi
            if git push; then
              echo "数据已推送"
              exit 0
            fi
            echo "第 $i 次推送失败，5 秒后重试…"
            sleep 5
          done
          echo "推送连续失败"
          exit 1

      - name: 结果摘要
        if: always()
        env:
          T: ${{ steps.t.outputs.target }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/summary.py >> $GITHUB_STEP_SUMMARY
          else python scripts/summary.py --server "$T" >> $GITHUB_STEP_SUMMARY; fi

      # 提交失败时把本次抓到的 data/ 留成 artifact，runner 销毁后仍可补救。
      # 只在仓库 Actions 后台可见，不会出现在网站页面上。
      - name: 失败时保留抓取结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-data-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 7
