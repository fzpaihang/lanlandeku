name: 刷新高手榜

# 北京时间 = UTC+8，每个分区一天只跑一次全量，时间错开
#   0 22 * * *  → 次日 06:00  苍松迎客（taptap）
#   55 15 * * * → 当日 23:55  白鹤亮翅 + 丹凤朝阳（taptap_2,taptap_3）
#   0 20 * * *  → 次日 04:00  应用汇 + 老马识途（yyh,ios1）
#   0 4 * * *   → 当日 12:00  墨羽惊鸿（taptap_4）
#   0 10 * * *  → 当日 18:00  4399
#   0 8 * * *   → 当日 16:00  其他服（guanfang）
#   0 18 * * *  → 次日 02:00  华为（huawei）
#   0 0 * * *   → 当日 08:00  野马分鬃（ios2）
#   0 2 * * *   → 当日 10:00  仙人指路（ios3）
#   0 12 * * *  → 当日 20:00  名人堂（11 区一次抓全，游戏 boardType=4，指标=江湖阅历）
# 单区全量约 5–8 分钟，各任务互不重叠，也避免连续请求触发限流。
# 每轮抓完就重建昵称索引（data/lookup-index.json），保证刚上榜的人立刻能按昵称搜到。
on:
  schedule:
    - cron: '0 22 * * *'   # 06:00 苍松迎客
    - cron: '55 15 * * *'  # 23:55 白鹤亮翅 + 丹凤朝阳
    - cron: '0 20 * * *'   # 次日 04:00 应用汇 + 老马识途
    - cron: '0 4 * * *'    # 12:00 墨羽惊鸿
    - cron: '0 10 * * *'   # 18:00 4399
    - cron: '0 8 * * *'    # 16:00 其他服
    - cron: '0 18 * * *'   # 次日 02:00 华为
    - cron: '0 0 * * *'    # 08:00 野马分鬃
    - cron: '0 2 * * *'    # 10:00 仙人指路
    - cron: '0 12 * * *'   # 20:00 名人堂（11 区）
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'probe'
        type: choice
        options:
          - probe        # 只验证能不能连上游戏服，不写文件
          - full         # 榜单 + 档案
          - board        # 只抓榜单
      server:
        # 从 choice 改成 string：看门狗要把「所有过期分区」一次派发成一个 run
        # （逗号串 taptap,taptap_4），choice 型只能选一个，历史上只能派 N 个 run，
        # 而同组 concurrency 只放 1 running + 1 pending，其余全被 cancel。
        # --server 全链路（fetch.py / fetch_profiles.py / merge_exp.py / summary.py）
        # 都支持逗号分隔，这里只要能把串传进去。
        # all = 十一区全量；单个区名照旧；hall11 必须单独跑（board 是全局参数）。
        description: '目标分区：all / 单区名 / 逗号串（taptap,taptap_4）/ hall11（名人堂只能单独跑）'
        required: true
        default: 'all'
        type: string

permissions:
  contents: write
  # 「失败自动补跑」步骤要用 REST 派发本工作流，需要 actions:write
  actions: write

concurrency:
  group: fzjh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 单区全量实测 2–3 分钟（档案约 105s 是大头）；六区一次跑历史最长 29 分钟，
    # 十一区全量（server=all）约 30–35 分钟。
    # 现在看门狗会把「所有过期分区」合成一个逗号串派发，长时间停更后一次可能塞进
    # 十一区；最坏情况（十一区全量 33 分钟 + 两轮限流冷却 240s/480s + 两轮各补抓
    # 十几个区）约 75 分钟，60 分钟不够。超时是硬杀，连「提交数据」（always()）
    # 都不会跑，整批白抓，所以放宽到 120 分钟。
    # 不放到更大：这个 run 占着 fzjh-data 队列，拖太久会把它后面的定时任务全堵住。
    timeout-minutes: 120

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 定时任务没有输入参数，靠 github.event.schedule 反查本次该抓哪个区。
      # cron→分区→中文名的映射表在 scripts/plan_refresh.py（可本地逐条验证），
      # 以前这里有两段 shell case，改 cron 要同步改两处，容易漏。
      - name: 解析本次目标分区
        id: t
        env:
          SCHED: ${{ github.event.schedule }}
          PICK: ${{ inputs.server }}
          MODE: ${{ inputs.mode }}
        run: |
          # target 是「任务标记」（hall11 之类不能当分区名），servers 才是喂给 --server 的分区串，
          # board 是游戏榜单编号（1=高手榜，4=名人堂）。非名人堂任务时 servers 就等于 target。
          python scripts/plan_refresh.py --schedule "$SCHED" --mode "$MODE" --pick "$PICK" >> "$GITHUB_OUTPUT"

      - name: 写入任务摘要
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          T: ${{ steps.t.outputs.target }}
          N: ${{ steps.t.outputs.label }}
        run: |
          {
            echo "### 本次刷新：$N（$T）"
            echo ""
            echo "- 触发方式：${MODE:-schedule}"
            echo "- UTC 时间：$(date -u '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"

      # 凭据全部走 Secrets，绝不写进仓库
      - name: 连通性探测
        env:
          FZJH_SERVERS: ${{ secrets.FZJH_SERVERS }}
          FZJH_HOTVER: ${{ secrets.FZJH_HOTVER }}
          T: ${{ steps.t.outputs.servers }}
        run: |
          # 探测用高手榜（board 1）：能同时验出握手/版本/数值，名人堂本轮稍后正式抓，不必探两遍。
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/fetch.py --probe
          else python scripts/fetch.py --probe --server "$T"; fi

      - name: 抓榜单
        if: github.event_name == 'schedule' || inputs.mode != 'probe'
        env:
          FZJH_SERVERS: ${{ secrets.FZJH_SERVERS }}
          FZJH_HOTVER: ${{ secrets.FZJH_HOTVER }}
          T: ${{ steps.t.outputs.servers }}
          B: ${{ steps.t.outputs.board }}
        run: |
          # B=4（名人堂）时加 --board 4 --max-pages 1：该榜每区只有 10 人，翻页返回的还是同样 10 人。
          BOARD_ARG=""
          if [ -n "$B" ] && [ "$B" != "1" ]; then BOARD_ARG="--board $B --max-pages 1"; fi

          # 整轮重试：fetch.py 内部已对 20616 做 15s/45s/90s 冷却，但限流窗口有时长达十几分钟，
          # 内层退避耗尽后整轮作废（fetch.py 故意不写残缺榜单），该区当天就没数据了。
          # 2026-11-20 12:49 墨羽惊鸿、2026-11-21 06:39 苍松迎客 两次事故都是这个链路，
          # 网页上表现为「19 号的数据直接跳到 21 号」。这里再给整轮 3 次机会。
          # 注意：重试必须写在同一步骤内，用单独的「失败后重试」步骤没用——
          # 上面已经失败过，后面所有步骤都会被跳过，数据照样不提交。
          # 用法注意：GitHub Actions 的 run 默认是 bash -e，所以「失败不算错」的命令
          # 必须放进 if 条件里（if cmd; then），不能写成 cmd && x —— 后者在 -e 下会直接退出。
          # 重跑时只重跑上一轮失败的分区：fetch.py 失败时会在末尾打印
          # FAILED_SERVERS=a,b。以前是整轮重跑（一个区撞限流，十个区跟着白跑）。
          run_fetch() {
            if [ -z "$1" ] || [ "$1" = "all" ]; then
              python scripts/fetch.py $BOARD_ARG
            else
              python scripts/fetch.py --server "$1" $BOARD_ARG
            fi
          }
          ok=0
          todo="$T"
          for i in 1 2 3; do
            echo "===== 第 $i 轮抓取（目标：${todo:-all}）====="
            if out=$(run_fetch "$todo" 2>&1); then rc=0; else rc=$?; fi
            printf '%s\n' "$out"
            if [ "$rc" = "0" ]; then ok=1; break; fi
            failed=$(printf '%s\n' "$out" | sed -n 's/^FAILED_SERVERS=//p' | tail -1)
            if [ -n "$failed" ]; then
              echo "本轮失败分区：$failed"
              todo="$failed"
            fi
            if [ "$i" -lt 3 ]; then
              cool=$((i * 240))
              echo "第 $i 轮失败（多为接口限流），冷却 ${cool}s 后重试失败的分区"
              sleep "$cool"
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "三轮都失败：保留上一版数据不动，等下一轮定时任务"
            exit 1
          fi

      - name: 抓玩家档案
        # 每个区的定时任务都是一次全量，所以只要不是 probe/board 就抓档案。
        # 名人堂任务也抓：网页上点名人堂的人要能页内看详情，而这些玩家可能不在前百高手榜里，
        # fetch_profiles.py 会额外把同目录 hall.json 的行并进目标（顺带也会刷新本区前百的档案）。
        if: (github.event_name == 'schedule') || (inputs.mode == 'full')
        env:
          FZJH_SERVERS: ${{ secrets.FZJH_SERVERS }}
          FZJH_HOTVER: ${{ secrets.FZJH_HOTVER }}
          T: ${{ steps.t.outputs.servers }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/fetch_profiles.py
          else python scripts/fetch_profiles.py --server "$T"; fi

      - name: 合并档案经验
        # 档案抓完再合并：get_board 对不活跃玩家会返回旧经验，用 get_user_info 的值覆盖，
        # 让表格、详情、增长曲线统一口径。名次仍是游戏原始名次，不重排。
        # 名人堂任务照跑：它只认 gaoshoubang.json，绝不碰 hall.json；
        # 而名人堂任务确实重抓了十一区前百档案，跳过反而会让「档案 exp 比榜单新」的不一致
        # 一直挂到各区自己的定时任务，正是这一步要消除的。
        if: (github.event_name == 'schedule') || (inputs.mode == 'full')
        env:
          T: ${{ steps.t.outputs.servers }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/merge_exp.py
          else python scripts/merge_exp.py --server "$T"; fi

      - name: 重建昵称索引
        # 每轮抓完立刻重建：新上榜的人下一轮就能按昵称搜到，不用等一周。
        # 索引里的 updatedAt 每轮都会变，会跟着数据提交一起走，不需要单独的提交步骤。
        # 事件驱动（extra-names.json 回写）与每周兜底仍由 lookup-index.yml 负责。
        if: (github.event_name == 'schedule') || (inputs.mode == 'full')
        run: python scripts/build_lookup_index.py

      - name: 提交数据
        # always()：榜单文件在「抓榜单」步就已经写盘了，后面「抓玩家档案」因限流失败
        # 不该把这份已经完整的榜单一起丢掉（那正是 11-20 / 11-21 两次事故的后果）。
        # 整轮彻底失败时 data/ 没有变化，下面的 git diff --staged --quiet 会直接跳过，安全。
        if: always()
        env:
          LABEL: ${{ steps.t.outputs.label }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "数据刷新 $LABEL $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          # 抓取期间远端可能已被其它提交推进（例如热更包通过 API 提交），
          # 先 rebase 到最新 main 再推，避免 non-fast-forward 导致整批数据丢失。
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort 2>/dev/null || true
              echo "rebase 冲突，放弃本次提交（data/ 已由 artifact 保留）"
              exit 1
            fi
            if git push; then
              echo "数据已推送"
              exit 0
            fi
            echo "第 $i 次推送失败，5 秒后重试…"
            sleep 5
          done
          echo "推送连续失败"
          exit 1

      - name: 结果摘要
        if: always()
        env:
          T: ${{ steps.t.outputs.servers }}
        run: |
          # summary.py 读的是各区 gaoshoubang.json；名人堂任务没抓高手榜，摘要显示上一版快照属正常。
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/summary.py >> $GITHUB_STEP_SUMMARY
          else python scripts/summary.py --server "$T" >> $GITHUB_STEP_SUMMARY; fi

      # 提交失败时把本次抓到的 data/ 留成 artifact，runner 销毁后仍可补救。
      # 只在仓库 Actions 后台可见，不会出现在网站页面上。
      - name: 失败时保留抓取结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-data-${{ github.run_id }}
          path: data/
          if-no-files-found: ignore
          retention-days: 7
