name: 刷新高手榜

# 北京时间 = UTC+8，每个分区一天只跑一次全量，时间错开
#   0 22 * * *  → 次日 06:00  苍松迎客（taptap）
#   0 1  * * *  → 当日 09:00  丹凤朝阳（taptap_3）
#   0 4  * * *  → 当日 12:00  墨羽惊鸿（taptap_4）
#   0 10 * * *  → 当日 18:00  4399
# 单区全量约 5–8 分钟，四条任务互不重叠，也避免连续请求触发限流。
on:
  schedule:
    - cron: '0 22 * * *'   # 06:00 苍松迎客
    - cron: '0 1  * * *'   # 09:00 丹凤朝阳
    - cron: '0 4  * * *'   # 12:00 墨羽惊鸿
    - cron: '0 10 * * *'   # 18:00 4399
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'probe'
        type: choice
        options:
          - probe        # 只验证能不能连上游戏服，不写文件
          - full         # 榜单 + 档案
          - board        # 只抓榜单
      server:
        description: '目标分区（手动触发时生效，定时任务由 cron 决定）'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - taptap
          - taptap_3
          - taptap_4
          - 4399

permissions:
  contents: write

concurrency:
  group: refresh-fzjh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 单区全量实测 7–8 分钟，30 分钟留足重试与排队余量
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 定时任务没有输入参数，靠 github.event.schedule 反查本次该抓哪个区
      - name: 解析本次目标分区
        id: t
        env:
          SCHED: ${{ github.event.schedule }}
          PICK: ${{ inputs.server }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ -n "$MODE" ]; then
            t="$PICK"
          else
            case "$SCHED" in
              '0 22 * * *') t='taptap' ;;
              '0 1 * * *')  t='taptap_3' ;;
              '0 4 * * *')  t='taptap_4' ;;
              '0 10 * * *') t='4399' ;;
              *)            t='all' ;;
            esac
          fi

          case "$t" in
            taptap)   n='苍松迎客' ;;
            taptap_3) n='丹凤朝阳' ;;
            taptap_4) n='墨羽惊鸿' ;;
            4399)     n='4399' ;;
            *)        n='全部' ;;
          esac

          echo "target=$t" >> "$GITHUB_OUTPUT"
          echo "label=$n"  >> "$GITHUB_OUTPUT"
          {
            echo "### 本次刷新：$n（$t）"
            echo ""
            echo "- 触发方式：${MODE:-schedule}"
            echo "- UTC 时间：$(date -u '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"

      # 凭据全部走 Secrets，绝不写进仓库
      - name: 连通性探测
        env:
          FZJH_SERVERS: ${{ secrets.FZJH_SERVERS }}
          FZJH_HOTVER: ${{ secrets.FZJH_HOTVER }}
          T: ${{ steps.t.outputs.target }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/fetch.py --probe
          else python scripts/fetch.py --probe --server "$T"; fi

      - name: 抓榜单
        if: github.event_name == 'schedule' || inputs.mode != 'probe'
        env:
          FZJH_SERVERS: ${{ secrets.FZJH_SERVERS }}
          FZJH_HOTVER: ${{ secrets.FZJH_HOTVER }}
          T: ${{ steps.t.outputs.target }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/fetch.py
          else python scripts/fetch.py --server "$T"; fi

      - name: 抓玩家档案
        # 每个区的定时任务都是一次全量，所以只要不是 probe/board 就抓档案
        if: (github.event_name == 'schedule') || (inputs.mode == 'full')
        env:
          FZJH_SERVERS: ${{ secrets.FZJH_SERVERS }}
          FZJH_HOTVER: ${{ secrets.FZJH_HOTVER }}
          T: ${{ steps.t.outputs.target }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/fetch_profiles.py
          else python scripts/fetch_profiles.py --server "$T"; fi

      - name: 提交数据
        env:
          LABEL: ${{ steps.t.outputs.label }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "数据刷新 $LABEL $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push

      - name: 结果摘要
        if: always()
        env:
          T: ${{ steps.t.outputs.target }}
        run: |
          if [ -z "$T" ] || [ "$T" = "all" ]; then python scripts/summary.py >> $GITHUB_STEP_SUMMARY
          else python scripts/summary.py --server "$T" >> $GITHUB_STEP_SUMMARY; fi
